<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 456" width="320" height="456">
  <title>ADS1115 breakout, breadboard view</title>
  <desc>Flat breadboard-view part drawn to the footprint of the board it replaces:
        two pad columns of six at 43.4 unit pitch. Right column is ALRT ADDR SCL SDA
        GND VDD top to bottom; left column carries the analog inputs. Pads are
        addressable as ads-padL-1..6 and ads-padR-1..6.</desc>

  <defs>
    <g id="ads-pad">
      <circle r="13" fill="#e0e3e3"/>
      <circle r="7.5" fill="#22505f"/>
      <circle r="2.6" fill="#e0e3e3"/>
    </g>
    <g id="ads-res">
      <rect x="0" y="0" width="34" height="20" fill="#cfd3d4"/>
      <rect x="6" y="0" width="22" height="20" fill="#332722"/>
    </g>
  </defs>

  <g id="ads1115" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-weight="700">
    <rect x="9" y="10" width="302" height="436" rx="8" fill="#1c6d89"/>

    <!-- silkscreen part number, reading top to bottom -->
    <text transform="rotate(90 150 112)" x="150" y="112" font-size="28"
          fill="#ffffff" letter-spacing="1">ADS1115</text>
    <text x="160" y="404" font-size="15" fill="#ffffff" text-anchor="middle"
          opacity="0.85">16-bit ADC</text>

    <!-- ADS1115 die, MSOP-10 -->
    <g id="ads-chip">
      <g fill="#b9bdbe">
        <rect x="66" y="220" width="10" height="7"/><rect x="66" y="234" width="10" height="7"/>
        <rect x="66" y="248" width="10" height="7"/>
        <rect x="134" y="220" width="10" height="7"/><rect x="134" y="234" width="10" height="7"/>
        <rect x="134" y="248" width="10" height="7"/>
      </g>
      <rect x="76" y="210" width="58" height="60" rx="2" fill="#2b2b2f"/>
      <circle cx="84" cy="218" r="3.5" fill="#4d4d55"/>
    </g>

    <!-- passives -->
    <g>
      <use xlink:href="#ads-res" xmlns:xlink="http://www.w3.org/1999/xlink" x="78" y="128"/>
      <use xlink:href="#ads-res" xmlns:xlink="http://www.w3.org/1999/xlink" x="78" y="160"/>
      <use xlink:href="#ads-res" xmlns:xlink="http://www.w3.org/1999/xlink" x="78" y="300"/>
      <use xlink:href="#ads-res" xmlns:xlink="http://www.w3.org/1999/xlink" x="78" y="332"/>
      <rect x="128" y="300" width="20" height="28" fill="#cfd3d4"/>
      <rect x="128" y="305" width="20" height="18" fill="#c8692a"/>
    </g>

    <!-- left pad column: analog inputs -->
    <g id="ads-padsL">
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padL-1" x="51" y="117"/>
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padL-2" x="51" y="160"/>
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padL-3" x="51" y="204"/>
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padL-4" x="51" y="247"/>
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padL-5" x="51" y="291"/>
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padL-6" x="51" y="334"/>
    </g>

    <!-- right pad column -->
    <g id="ads-padsR">
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padR-1" x="267" y="117"/>
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padR-2" x="267" y="160"/>
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padR-3" x="267" y="204"/>
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padR-4" x="267" y="247"/>
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padR-5" x="267" y="291"/>
      <use xlink:href="#ads-pad" xmlns:xlink="http://www.w3.org/1999/xlink" id="ads-padR-6" x="267" y="334"/>
    </g>

    <!-- right column labels, printed inboard of the pads -->
    <g id="ads-labelsR" font-size="24" fill="#ffffff" text-anchor="end">
      <text x="246" y="126">ALRT</text>
      <text x="246" y="169">ADDR</text>
      <text x="246" y="213">SCL</text>
      <text x="246" y="256">SDA</text>
      <text x="246" y="300">GND</text>
      <text x="246" y="343">VDD</text>
    </g>

    <!-- left column labels; fill these in once the originals are confirmed -->
    <g id="ads-labelsL" font-size="24" fill="#ffffff" text-anchor="start">
      <text x="72" y="126"></text>
      <text x="72" y="169"></text>
      <text x="72" y="213"></text>
      <text x="72" y="256"></text>
      <text x="72" y="300"></text>
      <text x="72" y="343"></text>
    </g>

    <!-- pin 1 marker -->
    <path d="M51 96 l14.8 6.2 6.2 14.8 -6.2 14.8 -14.8 6.2 -14.8-6.2 -6.2-14.8 6.2-14.8z"
          fill="none" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="6 4"/>
  </g>
</svg>
