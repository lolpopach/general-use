<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 268" width="320" height="268">
  <title>ADS1115 breakout</title>
  <desc>ADS1115 16-bit 4-channel ADC breakout, 1.0 x 0.65 in, single 10-pin header
        (V G SCL SDA ADDR ALRT A0 A1 A2 A3). Pin tails carry ids ads-pin-V ... ads-pin-A3;
        attach wires to the bottom tip of the tail you need.</desc>

  <defs>
    <linearGradient id="ads-pcb" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#26262e"/>
      <stop offset="0.45" stop-color="#17171d"/>
      <stop offset="1" stop-color="#0d0d12"/>
    </linearGradient>
    <linearGradient id="ads-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.45" stop-color="#e0b552"/>
      <stop offset="1" stop-color="#9c7420"/>
    </linearGradient>
    <linearGradient id="ads-pin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f757b"/>
      <stop offset="0.35" stop-color="#e6eaee"/>
      <stop offset="0.65" stop-color="#aeb4ba"/>
      <stop offset="1" stop-color="#585d63"/>
    </linearGradient>
    <linearGradient id="ads-chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c44"/>
      <stop offset="0.5" stop-color="#232329"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
  </defs>

  <g id="ads1115" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="700">
    <!-- PCB -->
    <rect x="10" y="8" width="300" height="195" rx="8" fill="url(#ads-pcb)"/>
    <rect x="10.75" y="8.75" width="298.5" height="193.5" rx="7.4"
          fill="none" stroke="#4a4a55" stroke-width="1.5" opacity="0.55"/>

    <!-- mounting holes -->
    <circle cx="32" cy="30" r="11" fill="#0a0a0d" stroke="#b9b9c4" stroke-width="2.5"/>
    <circle cx="288" cy="30" r="11" fill="#0a0a0d" stroke="#b9b9c4" stroke-width="2.5"/>

    <!-- silkscreen -->
    <path d="M160 16 l5.6 11.9 12.8 1.9 -9.3 9.3 2.3 13.1 -11.4-6.1 -11.4 6.1 2.3-13.1 -9.3-9.3 12.8-1.9z"
          fill="#d8dade" opacity="0.8"/>
    <text x="160" y="76" font-size="27" fill="#e9ecef" text-anchor="middle" letter-spacing="1.5">ADS1115</text>
    <text x="160" y="92" font-size="11" fill="#e9ecef" text-anchor="middle" opacity="0.7">16-BIT ADC</text>

    <!-- ADS1115 die, MSOP-10 -->
    <g id="ads-chip-body">
      <rect x="130" y="100" width="60" height="30" rx="3" fill="url(#ads-chip)"/>
      <circle cx="137" cy="107" r="2.6" fill="#5c5c66"/>
      <g fill="#9aa0a6">
        <rect x="119" y="104" width="11" height="3.6" rx="1"/><rect x="119" y="112" width="11" height="3.6" rx="1"/>
        <rect x="119" y="120" width="11" height="3.6" rx="1"/>
        <rect x="190" y="104" width="11" height="3.6" rx="1"/><rect x="190" y="112" width="11" height="3.6" rx="1"/>
        <rect x="190" y="120" width="11" height="3.6" rx="1"/>
      </g>
    </g>

    <!-- passives, so the board does not read as a blank rectangle -->
    <rect x="58" y="102" width="21" height="10" rx="1.5" fill="#c8b98a"/>
    <rect x="58" y="118" width="21" height="10" rx="1.5" fill="#c8b98a"/>
    <rect x="240" y="108" width="21" height="10" rx="1.5" fill="#8a8a92"/>

    <!-- 10-pin header at 0.1in pitch (30 units), V G SCL SDA ADDR ALRT A0 A1 A2 A3 -->
    <g id="ads-header">
      <g id="ads-pads" fill="url(#ads-gold)">
        <circle cx="25" cy="180" r="11"/><circle cx="55" cy="180" r="11"/><circle cx="85" cy="180" r="11"/>
        <circle cx="115" cy="180" r="11"/><circle cx="145" cy="180" r="11"/><circle cx="175" cy="180" r="11"/>
        <circle cx="205" cy="180" r="11"/><circle cx="235" cy="180" r="11"/><circle cx="265" cy="180" r="11"/>
        <circle cx="295" cy="180" r="11"/>
      </g>
      <g id="ads-pad-holes" fill="#0b0b0e">
        <circle cx="25" cy="180" r="4.5"/><circle cx="55" cy="180" r="4.5"/><circle cx="85" cy="180" r="4.5"/>
        <circle cx="115" cy="180" r="4.5"/><circle cx="145" cy="180" r="4.5"/><circle cx="175" cy="180" r="4.5"/>
        <circle cx="205" cy="180" r="4.5"/><circle cx="235" cy="180" r="4.5"/><circle cx="265" cy="180" r="4.5"/>
        <circle cx="295" cy="180" r="4.5"/>
      </g>

      <!-- labels read bottom-to-top, so text-anchor:start runs them up away from the pads -->
      <g id="ads-labels" font-size="12" fill="#e9ecef" text-anchor="start">
        <text transform="rotate(-90 25 166)"  x="25"  y="166">V</text>
        <text transform="rotate(-90 55 166)"  x="55"  y="166">G</text>
        <text transform="rotate(-90 85 166)"  x="85"  y="166">SCL</text>
        <text transform="rotate(-90 115 166)" x="115" y="166">SDA</text>
        <text transform="rotate(-90 145 166)" x="145" y="166">ADDR</text>
        <text transform="rotate(-90 175 166)" x="175" y="166">ALRT</text>
        <text transform="rotate(-90 205 166)" x="205" y="166">A0</text>
        <text transform="rotate(-90 235 166)" x="235" y="166">A1</text>
        <text transform="rotate(-90 265 166)" x="265" y="166">A2</text>
        <text transform="rotate(-90 295 166)" x="295" y="166">A3</text>
      </g>

      <g id="ads-pin-tails" fill="url(#ads-pin)">
        <rect id="ads-pin-V"    x="20"  y="203" width="10" height="52"/>
        <rect id="ads-pin-G"    x="50"  y="203" width="10" height="52"/>
        <rect id="ads-pin-SCL"  x="80"  y="203" width="10" height="52"/>
        <rect id="ads-pin-SDA"  x="110" y="203" width="10" height="52"/>
        <rect id="ads-pin-ADDR" x="140" y="203" width="10" height="52"/>
        <rect id="ads-pin-ALRT" x="170" y="203" width="10" height="52"/>
        <rect id="ads-pin-A0"   x="200" y="203" width="10" height="52"/>
        <rect id="ads-pin-A1"   x="230" y="203" width="10" height="52"/>
        <rect id="ads-pin-A2"   x="260" y="203" width="10" height="52"/>
        <rect id="ads-pin-A3"   x="290" y="203" width="10" height="52"/>
      </g>
    </g>
  </g>
</svg>
